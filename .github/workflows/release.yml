name: Release

# Fork release pipeline. Upstream's workflow is wired to infrastructure this
# repository has no access to — Blacksmith runners, a Cloudflare-hosted relay
# config, code-signing certificates, npm publish rights, Vercel, Discord — so
# this replaces it with the part a fork can actually run: build the desktop
# apps on GitHub-hosted runners and publish them as a GitHub Release.
#
# Builds are unsigned. macOS and Windows will warn on first launch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to the tag, or 0.0.0-dev for manual runs)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        name: Resolve version and tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
            tag="v${version}"
          else
            version="0.0.0-dev"
            tag="v0.0.0-dev"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building ${tag} (${version})"

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
    env:
      # electron-updater reads this to find the update feed. It defaults to
      # GITHUB_REPOSITORY, but pinning it keeps local and CI builds identical
      # and makes the intent obvious.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install ImageMagick (icon generation)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Build desktop artifact
        run: >-
          node scripts/build-desktop-artifact.ts
          --platform ${{ matrix.platform }}
          --target ${{ matrix.target }}
          --arch ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          # `build-desktop-artifact.ts` writes to <repo>/release by default.
          path: |
            release/**/*.AppImage
            release/**/*.dmg
            release/**/*.exe
            release/**/*.zip
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: List assets
        run: ls -la release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            T3 Code ${{ needs.version.outputs.tag }} — steven-3 fork

            Unsigned builds — macOS and Windows will warn on first launch.

            A fork of [T3 Code](https://github.com/pingdotgg/t3code).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
